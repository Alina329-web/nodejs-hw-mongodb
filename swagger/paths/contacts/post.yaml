tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phoneNumber"
            type: string
            example: '+380100000005'
          email:
            description: "Contact's email"
            type: string
            example: 'povalenko@gmail.com'
            enum: ['male', 'female', 'other']
          isFavourite:
            description: "Contact's isFavourite"
            type: boolean
            example: false
          contactType:
            description: "Contact's contactType"
            type: string
            enum: ['work', 'home', 'personal']

responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/student.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
